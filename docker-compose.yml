version: '3.8'

services:
  # Relational Database Engine (Odoo requires PostgreSQL)
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo_secure_db_pass
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    restart: always
    ports:
      - "5432:5432"

  # Odoo ERP Application Server
  web:
    build: .
    depends_on:
      - db
    ports:
      - "8069:8069"
      - "8072:8072"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo_secure_db_pass
    volumes:
      - odoo-web-data:/var/lib/odoo
      # Mounts the local host custom addons directory inside the container for live hot-reloading in dev
      - ./custom_addons:/mnt/extra-addons
    restart: always
    # Automatically include extra-addons module path when booting inside Docker
    command: odoo --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

volumes:
  odoo-db-data:
  odoo-web-data:
